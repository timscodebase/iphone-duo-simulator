<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
</style>
</head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="50%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>

    <!-- Outer rim / titanium bevel -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#48484A"/>
      <stop offset="40%" stop-color="#2C2C2E"/>
      <stop offset="60%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#3A3A3C"/>
    </linearGradient>

    <!-- Screen gradient - left (iOS vivid cyan/blue) -->
    <linearGradient id="screenLeft" x1="44" y1="80" x2="250" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="50%" stop-color="#5856D6"/>
      <stop offset="100%" stop-color="#AF52DE"/>
    </linearGradient>

    <!-- Screen gradient - right (iOS vivid purple/pink/orange) -->
    <linearGradient id="screenRight" x1="262" y1="80" x2="468" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5856D6"/>
      <stop offset="60%" stop-color="#AF52DE"/>
      <stop offset="100%" stop-color="#FF2D55"/>
    </linearGradient>

    <!-- Hinge spine gradient -->
    <linearGradient id="hingeGrad" x1="250" y1="0" x2="262" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="30%" stop-color="#38383A"/>
      <stop offset="50%" stop-color="#636366"/>
      <stop offset="70%" stop-color="#38383A"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="creaseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="chassisShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Chassis / Squircle Base with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6" filter="url(#chassisShadow)"/>

  <!-- Inner Phone Body Container -->
  <g id="dualScreenDisplay">
    <!-- Left Display Panel -->
    <rect x="52" y="76" width="198" height="360" rx="22" fill="url(#screenLeft)"/>
    <rect x="52" y="76" width="198" height="360" rx="22" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Right Display Panel -->
    <rect x="262" y="76" width="198" height="360" rx="22" fill="url(#screenRight)"/>
    <rect x="262" y="76" width="198" height="360" rx="22" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Left Screen App Grid / UI Accent -->
    <g opacity="0.35">
      <rect x="76" y="112" width="60" height="12" rx="6" fill="#FFFFFF"/>
      <rect x="76" y="136" width="150" height="8" rx="4" fill="#FFFFFF"/>
      <rect x="76" y="152" width="120" height="8" rx="4" fill="#FFFFFF"/>

      <rect x="76" y="184" width="42" height="42" rx="12" fill="#FFFFFF"/>
      <rect x="130" y="184" width="42" height="42" rx="12" fill="#FFFFFF"/>
      <rect x="184" y="184" width="42" height="42" rx="12" fill="#FFFFFF"/>
    </g>

    <!-- Right Screen WebMCP / Inspector UI Accent -->
    <g opacity="0.35">
      <rect x="286" y="112" width="70" height="12" rx="6" fill="#FFFFFF"/>
      <rect x="286" y="136" width="150" height="60" rx="10" fill="#000000" fill-opacity="0.4"/>
      <rect x="298" y="152" width="80" height="8" rx="4" fill="#64D2FF"/>
      <rect x="298" y="168" width="110" height="8" rx="4" fill="#30D158"/>
    </g>

    <!-- Corner Dynamic Island on Outer Fold corner (Left display top) -->
    <rect x="72" y="88" width="44" height="14" rx="7" fill="#000000"/>
    <circle cx="80" cy="95" r="3.5" fill="#1C1C1E"/>
    <circle cx="104" cy="95" r="2.5" fill="#0A84FF"/>

    <!-- Center Hinge Spine Structure -->
    <rect x="250" y="68" width="12" height="376" rx="6" fill="url(#hingeGrad)"/>

    <!-- Neon Fold Crease Line (HIG 445pt Dotted Guide) -->
    <line x1="256" y1="84" x2="256" y2="428" stroke="#64D2FF" stroke-width="2.5" stroke-dasharray="6 6" filter="url(#creaseGlow)"/>

    <!-- Central Fold Angle Emblem -->
    <circle cx="256" cy="256" r="22" fill="#1C1C1E" stroke="#64D2FF" stroke-width="2.5"/>
    <path d="M247 251 L256 261 L265 251" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</body>
</html>
